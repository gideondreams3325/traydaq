name: Traydaq Android APK (Public Builder)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/traydaq-android-apk.yml'

permissions:
  contents: read

concurrency:
  group: traydaq-public-android-apk
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build Traydaq Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 65

    steps:
      - name: Verify required private source and Android signing secrets
        env:
          SOURCE_TOKEN: ${{ secrets.SELLERFLOW_SOURCE_TOKEN }}
          DEBUG_KEYSTORE_B64: ${{ secrets.TRAYDAQ_DEBUG_KEYSTORE_B64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          if [ -z "$SOURCE_TOKEN" ]; then
            echo "::error::Missing SELLERFLOW_SOURCE_TOKEN. Add a GitHub Actions repository secret with Contents: read access only to the private gideondreams3325/sellerflow repository."
            exit 1
          fi
          if [ -z "$DEBUG_KEYSTORE_B64" ]; then
            echo "::error::Missing TRAYDAQ_DEBUG_KEYSTORE_B64. Add the Base64-encoded stable debug keystore as a repository Actions secret before building. Refusing to generate a different temporary signing certificate."
            exit 1
          fi
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Missing GOOGLE_SERVICES_JSON GitHub secret. Register the permanent Traydaq signing SHA-1 and SHA-256 in Firebase, download the updated Android google-services.json and add its entire contents as an Actions repository secret. Stopping before creating an APK with broken Google Sign-In."
            exit 1
          fi

      - name: Checkout private SellerFlow source (not published)
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/sellerflow
          ref: main
          token: ${{ secrets.SELLERFLOW_SOURCE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1

      - name: Strip legacy local account and activity snapshots
        shell: bash
        run: |
          set -euo pipefail
          # These JSON files are tracked in the private repository and some
          # contain account/recovery fields or previously removed content.
          # They must never be shipped inside a publicly downloadable APK.
          rm -rf data android/app/src/main/assets/public/data
          mkdir -p data
          echo '[]' > data/registered_accounts.json
          echo '[]' > data/posts_store.json
          echo '[]' > data/products_store.json
          echo '[]' > data/deleted_posts.json
          echo '{"jobs":[],"events":[],"jobApplications":[],"eventRegistrations":[]}' > data/jobs_events_store.json

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Check account switching, authentication screen and build app assets
        run: |
          node tests/android-account-switch.test.mjs
          node tests/traydaq-auth-screen-regression.test.mjs
          npm run build
          test -s dist/index.html
          node --input-type=module -e "import fs from 'node:fs';const html=fs.readFileSync('dist/index.html','utf8');if(!html.includes('class=\"text-[#17653c]\">Tray</span>')||html.includes('>Seller</span><span class=\"gold-gradient\">Flow'))process.exit(1);console.log('PASS: bundled Android login shows Traydaq, not SellerFlow.')"

      - name: Synchronize Android assets using the latest Firebase SDK config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          npx cap sync android
          node scripts/prepare-android-variants.js
          node scripts/patch-capacitor.js
          test -s android/app/google-services.json
          grep -q "AndroidGoogleAuthBridge" dist/index.html

      - name: Re-sanitize packaged account snapshots before Gradle
        shell: bash
        run: |
          set -euo pipefail
          # Capacitor asset sync may restore previously tracked app assets.
          # Empty these local account snapshots after ALL bundling/sync steps.
          for snapshot in \
            data/registered_accounts.json \
            dist/data/registered_accounts.json \
            android/app/src/main/assets/public/data/registered_accounts.json; do
            mkdir -p "$(dirname "$snapshot")"
            echo '[]' > "$snapshot"
            if [ "$(tr -d '[:space:]' < "$snapshot")" != "[]" ]; then
              echo "::error::Account sanitization failed at $snapshot"
              exit 1
            fi
          done

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Install and validate permanent Traydaq debug signing key
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.TRAYDAQ_DEBUG_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          sed -i 's/gradle-8.2.1-all.zip/gradle-8.7-all.zip/' android/gradle/wrapper/gradle-wrapper.properties

          mkdir -p "$HOME/.android"
          chmod 700 "$HOME/.android"
          printf '%s' "$DEBUG_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          test -s "$HOME/.android/debug.keystore" || { echo "::error::Decoded Traydaq debug keystore is empty."; exit 1; }
          chmod 600 "$HOME/.android/debug.keystore"

          if ! keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey > /dev/null 2>&1; then
            echo "::error::TRAYDAQ_DEBUG_KEYSTORE_B64 is not a valid Android debug keystore with alias androiddebugkey and the standard debug store password. Verify the complete secret value."
            exit 1
          fi
          echo "Permanent Traydaq signing keystore loaded and validated."
          # Gradle may use another default debug-keystore path on GitHub runners.
          # Explicitly set the signingConfig so the APK is signed with this secret.
          echo "TRAYDAQ_DEBUG_KEYSTORE_FILE=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "ANDROID_USER_HOME=$HOME/.android" >> "$GITHUB_ENV"
          python3 - <<'PY'
          from pathlib import Path
          app_gradle = Path("android/app/build.gradle")
          src = app_gradle.read_text(encoding="utf-8")
          needle = "android {\n"
          if src.count(needle) != 1 or "    buildTypes {\n        release {" not in src:
              raise SystemExit("Android Gradle structure changed; explicit signing config not applied.")
          src = src.replace(needle, """android {
              signingConfigs {
                  debug {
                      storeFile file(System.getenv('TRAYDAQ_DEBUG_KEYSTORE_FILE'))
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
          """, 1)
          src = src.replace("    buildTypes {\n        release {", """    buildTypes {
                  debug {
                      signingConfig signingConfigs.debug
                  }
                  release {""", 1)
          app_gradle.write_text(src, encoding="utf-8")
          print("Explicit debug signingConfig installed for permanent Traydaq keystore.")
          PY

      - name: Validate real Android Google OAuth registration before building APK
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          node scripts/validate-traydaq-android-oauth.mjs

      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Package, verify and fingerprint the APK
        shell: bash
        run: |
          set -euo pipefail
          node scripts/package-apks.js
          test -s Traydaq-debug.apk
          ls -lh Traydaq-debug.apk
          sha256sum Traydaq-debug.apk
          # Compare the actual APK signer to the permanent keystore's
          # DER certificate (without ever printing private key material).
          python3 - <<'PY'
          import glob
          import hashlib
          import os
          import re
          import subprocess
          from pathlib import Path

          ks = os.environ["TRAYDAQ_DEBUG_KEYSTORE_FILE"]
          cert = subprocess.check_output([
              "keytool", "-exportcert", "-keystore", ks,
              "-storepass", "android", "-alias", "androiddebugkey"
          ], stderr=subprocess.DEVNULL)
          expected_sha1 = hashlib.sha1(cert).hexdigest().upper()
          expected_sha256 = hashlib.sha256(cert).hexdigest().upper()
          if expected_sha1 != "467D251759335B94B10A729A6733FADC8DF50D31":
              raise SystemExit("ERROR: Secret keystore differs from the permanent Traydaq signing key.")

          sdk = os.environ.get("ANDROID_HOME") or os.environ.get("ANDROID_SDK_ROOT") or "/usr/local/lib/android/sdk"
          candidates = sorted(glob.glob(f"{sdk}/build-tools/*/apksigner"))
          if not candidates:
              raise SystemExit("ERROR: Android apksigner unavailable.")
          result = subprocess.run([candidates[-1], "verify", "--print-certs", "Traydaq-debug.apk"],
                                  capture_output=True, text=True)
          if result.returncode:
              raise SystemExit("ERROR: APK signature verification failed: " + result.stderr[-500:])
          print("APK certificate report:\\n" + result.stdout)
          digests = dict((alg.upper(), h.upper().replace(":", ""))
                         for alg, h in re.findall(
                             r"certificate\s+SHA-(1|256)\s+digest:\s*([0-9a-fA-F:]+)",
                             result.stdout, re.IGNORECASE))
          if digests.get("256") != expected_sha256 and digests.get("1") != expected_sha1:
              raise SystemExit("ERROR: APK signing certificate does not match permanent keystore. Upload blocked.")
          print("SUCCESS: APK is signed using the permanent Traydaq debug keystore.")
          print("Verified SHA-1:", expected_sha1)
          PY

      - name: Ensure no legacy account records are packaged
        shell: bash
        run: |
          set -euo pipefail
          for snapshot in \
            data/registered_accounts.json \
            dist/data/registered_accounts.json \
            android/app/src/main/assets/public/data/registered_accounts.json; do
            if [ -f "$snapshot" ] && [ "$(tr -d '[:space:]' < "$snapshot")" != "[]" ]; then
              echo "::error::Nonempty account snapshot was found in a packaged asset."
              exit 1
            fi
          done
          # Check the APK's actual ZIP payload, not just the working files.
          account_asset="assets/public/data/registered_accounts.json"
          if unzip -Z1 Traydaq-debug.apk | grep -Fxq "$account_asset"; then
            if [ "$(unzip -p Traydaq-debug.apk "$account_asset" | tr -d '[:space:]')" != "[]" ]; then
              echo "::error::An account record was detected inside the APK. Upload blocked."
              exit 1
            fi
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Traydaq-debug-APK
          path: Traydaq-debug.apk
          if-no-files-found: error
          retention-days: 7
