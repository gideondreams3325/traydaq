name: Traydaq Android APK (Public Builder)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: traydaq-public-android-apk
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build Traydaq Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 65

    steps:
      - name: Check private repository access
        env:
          SOURCE_TOKEN: ${{ secrets.SELLERFLOW_SOURCE_TOKEN }}
        shell: bash
        run: |
          if [ -z "$SOURCE_TOKEN" ]; then
            echo "::error::Missing SELLERFLOW_SOURCE_TOKEN. Set an Actions repository secret containing a fine-grained GitHub token with Contents: read access only to gideondreams3325/sellerflow."
            exit 1
          fi

      - name: Checkout private SellerFlow source (not published)
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/sellerflow
          ref: main
          token: ${{ secrets.SELLERFLOW_SOURCE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1

      - name: Strip legacy local account and activity snapshots
        shell: bash
        run: |
          set -euo pipefail
          # These JSON files are tracked in the private repository and some
          # contain account/recovery fields or previously removed content.
          # They must never be shipped inside a publicly downloadable APK.
          rm -rf data android/app/src/main/assets/public/data
          mkdir -p data
          printf '[]\\n' > data/registered_accounts.json
          printf '[]\\n' > data/posts_store.json
          printf '[]\\n' > data/products_store.json
          printf '[]\\n' > data/deleted_posts.json
          printf '{"jobs":[],"events":[],"jobApplications":[],"eventRegistrations":[]}\\n' > data/jobs_events_store.json

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Check account switching and build app assets
        run: |
          node tests/android-account-switch.test.mjs
          npm run build
          test -s dist/index.html

      - name: Synchronize Android assets
        run: |
          npx cap sync android
          node scripts/prepare-android-variants.js
          node scripts/patch-capacitor.js
          test -s android/app/google-services.json
          grep -q "AndroidGoogleAuthBridge" dist/index.html

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Prepare Gradle and optional stable debug signing key
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.TRAYDAQ_DEBUG_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          sed -i 's/gradle-8.2.1-all.zip/gradle-8.7-all.zip/' android/gradle/wrapper/gradle-wrapper.properties

          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$DEBUG_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
            test -s "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
            echo "Using existing stable Android debug signing key."
          else
            echo "::warning::TRAYDAQ_DEBUG_KEYSTORE_B64 is not set. Gradle will create a temporary debug key, so this APK may not update previously installed builds and native Google Sign-In may require Firebase SHA registration."
          fi

      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Package, verify and fingerprint the APK
        shell: bash
        run: |
          set -euo pipefail
          node scripts/package-apks.js
          test -s Traydaq-debug.apk
          ls -lh Traydaq-debug.apk
          sha256sum Traydaq-debug.apk
          if [ -f "$HOME/.android/debug.keystore" ]; then
            keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android | grep -E 'SHA1:|SHA256:'
          fi

      - name: Ensure no legacy account records are packaged
        shell: bash
        run: |
          set -euo pipefail
          for snapshot in \
            data/registered_accounts.json \
            dist/data/registered_accounts.json \
            android/app/src/main/assets/public/data/registered_accounts.json; do
            if [ -f "$snapshot" ] && [ "$(tr -d '[:space:]' < "$snapshot")" != "[]" ]; then
              echo "::error::Nonempty account snapshot was found in a packaged asset."
              exit 1
            fi
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Traydaq-debug-APK
          path: Traydaq-debug.apk
          if-no-files-found: error
          retention-days: 7
