name: Traydaq Android APK (Public Builder)

on:
  workflow_dispatch:
  # Allow the owner to start a single build by updating this workflow on main.
  # Rebuild with validated Inbox RTDB references (October 11, 2026).
  # Pull requests and commits to other files do not trigger private source checkout.
  push:
    branches: [main]
    paths:
      - '.github/workflows/traydaq-android-apk.yml'

permissions:
  contents: read

concurrency:
  group: traydaq-public-android-apk
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build Traydaq Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 65

    steps:
      - name: Verify required private source and Android signing secrets
        env:
          SOURCE_TOKEN: ${{ secrets.SELLERFLOW_SOURCE_TOKEN }}
          DEBUG_KEYSTORE_B64: ${{ secrets.TRAYDAQ_DEBUG_KEYSTORE_B64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          if [ -z "$SOURCE_TOKEN" ]; then
            echo "::error::Missing SELLERFLOW_SOURCE_TOKEN. Add a GitHub Actions repository secret with Contents: read access only to the private gideondreams3325/sellerflow repository."
            exit 1
          fi
          if [ -z "$DEBUG_KEYSTORE_B64" ]; then
            echo "::error::Missing TRAYDAQ_DEBUG_KEYSTORE_B64. Add the Base64-encoded stable debug keystore as a repository Actions secret before building. Refusing to generate a different temporary signing certificate."
            exit 1
          fi
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Missing GOOGLE_SERVICES_JSON GitHub secret. Register the permanent Traydaq signing SHA-1 and SHA-256 in Firebase, download the updated Android google-services.json and add its entire contents as an Actions repository secret. Stopping before creating an APK with broken Google Sign-In."
            exit 1
          fi

      - name: Checkout private SellerFlow source (not published)
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/sellerflow
          ref: main
          token: ${{ secrets.SELLERFLOW_SOURCE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1

      - name: Apply safe account-count correction to checked-out private source
        shell: bash
        run: |
          set -euo pipefail
          # Pin this public patch to the exact workflow commit being executed.
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/gideondreams3325/traydaq/${GITHUB_SHA}/scripts/patch-private-admin-metrics.mjs" \
            --output /tmp/traydaq-admin-metrics-patch.mjs
          node --check /tmp/traydaq-admin-metrics-patch.mjs
          node /tmp/traydaq-admin-metrics-patch.mjs .
          node tests/traydaq-admin-overview-edge.test.mjs
          # Never print or upload private source files.
      - name: Modernize clickable Traydaq Security Team Portal
        shell: bash
        run: |
          set -euo pipefail
          # Public UI patches are pinned to this workflow revision; private sources stay private.
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/gideondreams3325/traydaq/${GITHUB_SHA}/scripts/patch-private-admin-ui.mjs" \
            --output /tmp/traydaq-admin-ui-patch.mjs
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/gideondreams3325/traydaq/${GITHUB_SHA}/assets/traydaq-admin-dashboard.css" \
            --output /tmp/traydaq-admin-dashboard.css
          node --check /tmp/traydaq-admin-ui-patch.mjs
          node /tmp/traydaq-admin-ui-patch.mjs . /tmp/traydaq-admin-dashboard.css
          # Fail the APK build rather than silently shipping an unpatched dashboard.
          grep -q 'id="tdAdminDashboard"' index.html
          grep -q 'id="dashCardNotify"' index.html
          grep -q 'id="dashCardTerms"' index.html
          grep -q 'id="dashCardReports"' index.html
      - name: Verify Traydaq admin overview navigation regression
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const html = fs.readFileSync('index.html', 'utf8');
          const backLink = "$('tdAdminBackOverview')?.addEventListener('click', () => setAdminTab('overview'));";
          if (!html.includes(backLink)) {
            throw new Error('Admin back-to-overview button is not connected to the local router.');
          }
          if (!html.includes('id="tdAdminDashboard"') || !html.includes('id="adminWorkspace"')) {
            throw new Error('Security dashboard or page workspace is missing.');
          }
          console.log('PASS: Traydaq admin back navigation routes directly to Overview.');
          JS

      - name: Prevent admin dashboard freezes on Android
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/gideondreams3325/traydaq/${GITHUB_SHA}/scripts/patch-private-admin-freeze.mjs" \
            --output /tmp/traydaq-admin-freeze-patch.mjs
          node --check /tmp/traydaq-admin-freeze-patch.mjs
          node /tmp/traydaq-admin-freeze-patch.mjs .
          grep -q 'tdAdminAppendMore' index.html
          grep -q 'tdLastListenerRefresh<60000' index.html
          node tests/traydaq-admin-overview-edge.test.mjs
      - name: Separate Traydaq ID verification from admin-only blue checks
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/gideondreams3325/traydaq/${GITHUB_SHA}/scripts/patch-private-verification-badges.mjs" \
            --output /tmp/traydaq-badge-patch.mjs
          node --check /tmp/traydaq-badge-patch.mjs
          node /tmp/traydaq-badge-patch.mjs .
          grep -q 'id="dashCardBlueChecks"' index.html
          grep -q 'sfAdminBlueChecks(users)' index.html
          grep -q '🆔 Verified' index.html
          grep -q 'tdBlueBadgeEndpoint' index.html
          grep -q "else if(tabName === 'blue_checks') sfAdminBlueChecks(users);" index.html
          # The official user check must never be granted by PRO status or KYC alone.
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const h=fs.readFileSync('index.html','utf8');
          const badgeStart=h.indexOf('function sfIsVerifiedBadgeActive(u) {');
          const badgeEnd=h.indexOf('window.sfIsVerifiedBadgeActive',badgeStart);
          const badgeFn=h.slice(badgeStart,badgeEnd);
          if(badgeStart<0||badgeEnd<0||!badgeFn.includes('sfBlueBadgeUidSet')||
             badgeFn.includes('isPro')||badgeFn.includes("role === 'admin'")) {
            throw new Error('Legacy subscription or identity status still grants a blue badge');
          }
          if(!h.includes('function tdTrustBadgeHtml(u){')||
             !h.includes('window.sfBlueBadgeRegistryOnline')||
             !h.includes('Blue checks are awarded separately')) {
            throw new Error('Identity label or authoritative blue badge registry missing');
          }
          const badgeBegin=h.indexOf('function sfAccountVerified(u){');
          const trustEnd=h.indexOf('window.sfRefreshBlueBadges=sfRefreshBlueBadges;',badgeBegin);
          if(badgeBegin<0||trustEnd<0)throw new Error('Missing badge validation functions.');
          const isolate=new Function('window',h.slice(badgeBegin,trustEnd)+';return tdTrustBadgeHtml;');
          const noBlue=isolate({sfBlueBadgeUidSet:new Set()});
          if(!noBlue({uid:'testUidAlpha',accountVerified:true}).includes('🆔 Verified') ||
             noBlue({uid:'testUidAlpha',accountVerified:true}).includes('td-blue-badge') ||
             noBlue({uid:'testUidAlpha',role:'admin',isPro:true,verified:true}).includes('td-blue-badge')) {
            throw new Error('KYC, PRO or admin status automatically grants blue check.');
          }
          const approved=isolate({sfBlueBadgeUidSet:new Set(['testUidAlpha'])});
          if(!approved({uid:'testUidAlpha',accountVerified:true}).includes('td-blue-badge')) {
            throw new Error('Server-approved blue checks are not rendered.');
          }
          const profileStart=h.indexOf('async function loadPublicProfiles(){');
          if(profileStart<0 || h.slice(profileStart,profileStart+180).includes('await sfRefreshBlueBadges()') ||
             !h.includes('AbortSignal.timeout(7000)')) {
            throw new Error('Blue badge lookup must not block profile loading indefinitely.');
          }
          if(!h.includes('window.sfOfficialTraydaqUid=')||
             !h.includes('window.sfBlueBadgeUidSet.add(window.sfOfficialTraydaqUid)')||
             !h.includes('tdRefreshVisibleTrustBadges();')||
             !h.includes('data-td-trust-uid')||
             !h.includes('btn.disabled=official||!window.sfBlueBadgeRegistryOnline;')||
             !h.includes('Permanent official badge')) {
            throw new Error('Official Traydaq account must be permanently blue-checked and not revocable in the UI.');
          }
          if(!h.includes('getIdTokenResult(true)')||
             !h.includes('claims.email_verified!==true')||
             !h.includes('tdResolveSignedInOfficialBadge();')||
             !h.includes('window.sfBlueBadgeRegistryOnline=data.registryOnline!==false;')||
             !h.includes('window.setInterval(()=>{if(document.visibilityState==="visible")sfRefreshBlueBadges()')||
             !h.includes('data-td-trust-uid')) {
            throw new Error('Permanent admin identity fallback or registry retry is missing.');
          }
          console.log('PASS: dynamic official Traydaq blue check, permanent admin protection, ID distinction, Firebase owner fallback and nonblocking hydration.');

          JS

      - name: Stop Firebase availability lookups creating throwaway accounts
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/gideondreams3325/traydaq/${GITHUB_SHA}/scripts/patch-private-auth-availability.mjs" \
            --output /tmp/traydaq-auth-availability-patch.mjs
          node --check /tmp/traydaq-auth-availability-patch.mjs
          node /tmp/traydaq-auth-availability-patch.mjs .
          node --check server.js
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const code=fs.readFileSync('server.js','utf8');
          const begin=code.indexOf("app.post('/api/auth/check-availability'");
          const end=code.indexOf("// 3. Check registeredEmails collection in Firestore",begin);
          if(begin<0||end<begin||code.slice(begin,end).includes('accounts:signUp')||
             !code.slice(begin,end).includes('getUserByEmail')) {
            throw new Error('Email availability lookup still creates Firebase users');
          }
          console.log('PASS: Firebase account availability check is read-only.');
          JS

      - name: Apply account usernames across Traydaq UI
        shell: bash
        run: |
          set -euo pipefail
          # Patch only the temporary private checkout; do not publish private source.
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/gideondreams3325/traydaq/${GITHUB_SHA}/scripts/patch-private-usernames.mjs" \
            --output /tmp/traydaq-usernames-patch.mjs
          node --check /tmp/traydaq-usernames-patch.mjs
          node /tmp/traydaq-usernames-patch.mjs .
          grep -q 'id="tdActualUsernames"' index.html
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const source=fs.readFileSync('index.html','utf8');
          const start=source.indexOf('<script id="tdActualUsernames">');
          const end=source.indexOf('</script>',start);
          if(start<0||end<0||!source.slice(start,end).includes('MutationObserver')||
            !source.slice(start,end).includes('handleInCard')||
            !source.slice(start,end).includes('accountHandleFor')) {
            throw new Error('App-wide username renderer patch is missing.');
          }
          new Function(source.slice(start + '<script id="tdActualUsernames">'.length,end));
          console.log('PASS: real username display logic is injected and syntactically valid.');
          JS

      - name: Remove phone recovery from Traydaq Account Security
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/gideondreams3325/traydaq/${GITHUB_SHA}/scripts/patch-private-email-only-recovery.mjs" \
            --output /tmp/traydaq-email-only-recovery-patch.mjs
          node --check /tmp/traydaq-email-only-recovery-patch.mjs
          node /tmp/traydaq-email-only-recovery-patch.mjs .
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const html=fs.readFileSync('index.html','utf8');
          const start=html.indexOf('<script id="tdEmailOnlyRecovery">');
          const end=html.indexOf('</script>',start);
          if(start<0||end<=start||!html.includes('Recovery Email')||
             !/Managed (?:via|by) Google/i.test(html)) {
            throw new Error('Email-only recovery is missing, or original email/Google account controls are gone.');
          }
          const code=html.slice(start+'<script id="tdEmailOnlyRecovery">'.length,end);
          new Function(code);
          for(const marker of ['removePhoneCard','Recovery Phone Number',
            'Add a recovery email to protect your account',
            'MutationObserver']) {
            if(!code.includes(marker))throw new Error('Phone-recovery removal guard missing: '+marker);
          }
          console.log('PASS: Recovery phone UI is removed on all account-security mounts; email and Google settings remain.');
          JS

      - name: Replace legacy Terms screen with music and content publishing agreement
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/gideondreams3325/traydaq/${GITHUB_SHA}/scripts/patch-private-legal-terms.mjs" \
            --output /tmp/traydaq-legal-terms-patch.mjs
          node --check /tmp/traydaq-legal-terms-patch.mjs
          node /tmp/traydaq-legal-terms-patch.mjs .
          node --input-type=module <<'JS'
          import fs from "node:fs";
          const html=fs.readFileSync("index.html","utf8");
          for(const required of ["TD_TRAYDAQ_LEGAL_POLICY_TEXT","tdTermsFromApp(appTerms)","Allow Creator Reuse","Electronic Transactions Act","Music, sound recordings"]) {
            if(!html.includes(required))throw new Error("Missing current legal policy: "+required);
          }
          const modal=html.match(/function showTermsModal[\s\S]{0,250}tdTermsFromApp\(appTerms\)/);
          if(!modal)throw new Error("Terms modal is not using current legal content.");
          console.log("PASS: Traydaq in-app terms include music licensing, uploads and Ghanaian law.");
          JS

      - name: Synchronize received likes on public and personal profiles
        shell: bash
        run: |
          set -euo pipefail
          # Read the pinned public-only patch. The actual app remains checked out privately.
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/gideondreams3325/traydaq/${GITHUB_SHA}/scripts/patch-private-live-profile-likes.mjs" \
            --output /tmp/traydaq-live-likes-patch.mjs
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/gideondreams3325/traydaq/${GITHUB_SHA}/scripts/test-private-live-profile-likes.mjs" \
            --output /tmp/traydaq-live-likes-test.mjs
          node --check /tmp/traydaq-live-likes-patch.mjs
          node --check /tmp/traydaq-live-likes-test.mjs
          node /tmp/traydaq-live-likes-patch.mjs .
          node /tmp/traydaq-live-likes-test.mjs
          node --check post-social.js
          node --check profile-social-panels.js
          grep -Fq "action === 'like' ? countEntries(all)" post-social.js
          # Also run the preexisting content and profile activity safeguards.
          node tests/profile-social-activity.test.mjs
          # Post-engagement suite also needs dist/ and synced Android assets.

      - name: Fix secure Android liveness camera and verification capture
        shell: bash
        run: |
          set -euo pipefail
          # Public patch only runs inside the private checkout; no private app data is exported.
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/gideondreams3325/traydaq/${GITHUB_SHA}/scripts/patch-private-verification-camera.mjs" \
            --output /tmp/traydaq-verification-camera-patch.mjs
          node --check /tmp/traydaq-verification-camera-patch.mjs
          node /tmp/traydaq-verification-camera-patch.mjs .
          grep -Fq 'tdCameraFix2026' index.html
          grep -Fq 'TraydaqCameraPermissionBridge' android/app/src/main/java/com/sellerflow/app/MainActivity.java
          grep -Fq 'Four separate live camera views are required' index.html
          if grep -Fq "const photos = {" index.html && grep -Fq "FALLBACK_CAPTURE" index.html; then
            echo '::error::Verification could still accept the same gallery image for all live angles.'
            exit 1
          fi
          echo 'PASS: Camera permission bridge, secure four-view capture and anti-spoof regression guards.'

      - name: Restore Android verification live camera preview
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/gideondreams3325/traydaq/${GITHUB_SHA}/scripts/patch-private-camera-preview.mjs" -o /tmp/td-preview-fix.mjs
          node --check /tmp/td-preview-fix.mjs
          node /tmp/td-preview-fix.mjs .
          grep -Fq 'tdVisibleCameraFrame2026' index.html
          grep -Fq 'tdStartVerificationCamera' index.html

      - name: Fix Inbox and chat invalid Firestore collection paths
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/gideondreams3325/traydaq/${GITHUB_SHA}/scripts/patch-private-inbox-rtdb.mjs" \
            --output /tmp/traydaq-inbox-rtdb-patch.mjs
          node --check /tmp/traydaq-inbox-rtdb-patch.mjs
          node /tmp/traydaq-inbox-rtdb-patch.mjs .
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const h=fs.readFileSync('index.html','utf8');
          if(!h.includes('TRAYDAQ_INBOX_RTDB_PATH_FIX_V1') ||
             !h.includes("rt.ref('messages/' + cid + '/' + mid)") ||
             h.includes("collection(db,'messages',cid)") ||
             h.includes("collection(db, 'messages', cid)") ||
             h.includes("doc(db, 'messages', cid, mid)") ||
             h.includes("doc(db,'messages',cid,mid)")) {
            throw Error('Inbox still contains an invalid Firestore reference');
          }
          console.log('PASS: valid chat paths and realtime listener.');
          JS

      - name: Bundle secure FaceMesh tracker into Traydaq APK
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/gideondreams3325/traydaq/${GITHUB_SHA}/scripts/patch-private-verification-face-assets.mjs" \
            --output /tmp/traydaq-face-assets-patch.mjs
          node --check /tmp/traydaq-face-assets-patch.mjs
          node /tmp/traydaq-face-assets-patch.mjs .
          grep -Fq '/traydaq-face-mesh/face_mesh.js' index.html
          if grep -Fq 'cdn.jsdelivr.net/npm/@mediapipe/face_mesh' index.html; then
            echo "::error::Camera verification is still dependent on an external model CDN."
            exit 1
          fi
      - name: Modernize all Traydaq form controls and job application on Android
        shell: bash
        run: |
          set -euo pipefail
          # Only the public CSS and patch script are fetched. Private source stays inside the runner.
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/gideondreams3325/traydaq/${GITHUB_SHA}/scripts/patch-private-modern-forms.mjs" \
            --output /tmp/traydaq-modern-forms.mjs
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/gideondreams3325/traydaq/${GITHUB_SHA}/assets/traydaq-modern-forms.css" \
            --output /tmp/traydaq-modern-forms.css
          node --check /tmp/traydaq-modern-forms.mjs
          node /tmp/traydaq-modern-forms.mjs . /tmp/traydaq-modern-forms.css
          node --check jobs-events.js
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const page=fs.readFileSync('index.html','utf8');
          const jobs=fs.readFileSync('jobs-events.js','utf8');
          for(const v of ['id="tdModernForms2026"','#applyJobModal .td-form-dialog',
            'font-size: 16px','td-form-submit']) {
            if(!page.includes(v))throw new Error('Missing shared form stylesheet: '+v);
          }
          for(const v of ['role="dialog"','aria-modal="true"','aria-labelledby="tdApplyHeading"',
            'id="applicantEmail"','id="applicantPhone"','id="applicantCvFile"',
            'id="applicantScamAck"','id="submitApplicationBtn"','class="td-form-fields"',
            'class="td-form-actions"','10 * 1024 * 1024',
            "modal.querySelector('#applyJobForm').onsubmit"]) {
            if(!jobs.includes(v))throw new Error('Job application markup or logic missing: '+v);
          }
          if(jobs.includes('id="applicantCvFile" accept=".pdf,.docx,.doc,image/*" class="w-full')) {
            throw new Error('Old overflowing native upload control still exists');
          }
          console.log('PASS: mobile job-application fields, file-picker validation, sticky action area and shared styles.');
          JS

      - name: Modernize Marketplace, Vacancies and Events as responsive card grids
        shell: bash
        run: |
          set -euo pipefail
          # The public repository contains only UI patch instructions.
          # Apply to the temporary private checkout; do not publish private files.
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/gideondreams3325/traydaq/${GITHUB_SHA}/scripts/patch-private-discovery-grids.mjs" \
            --output /tmp/traydaq-discovery-grids.mjs
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/gideondreams3325/traydaq/${GITHUB_SHA}/assets/traydaq-discovery-grids.css" \
            --output /tmp/traydaq-discovery-grids.css
          node --check /tmp/traydaq-discovery-grids.mjs
          node /tmp/traydaq-discovery-grids.mjs . /tmp/traydaq-discovery-grids.css
          node --check jobs-events.js
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const html=fs.readFileSync('index.html','utf8');
          const jobs=fs.readFileSync('jobs-events.js','utf8');
          for(const marker of ['id="tdDiscoveryGrid2026"','id="tdDiscoveryMedia2026"',
            '#productGrid, #storeGrid, #jobsListContainer, #eventsListContainer',
            'grid-template-columns:repeat(2,minmax(0,1fr))!important',
            'grid-template-columns:repeat(3,minmax(0,1fr))!important',
            'grid-template-columns:repeat(4,minmax(0,1fr))!important']) {
            if(!html.includes(marker))throw new Error('Discovery grid patch missing: '+marker);
          }
          if(!jobs.includes('class="td-job-card ') || !jobs.includes('data-event-card=')) {
            throw new Error('Jobs and events cards missing after layout patch.');
          }
          const open='<script id="tdDiscoveryMedia2026">';
          const start=html.indexOf(open),end=html.indexOf('</script>',start);
          if(start<0||end<start)throw new Error('Missing product image recovery handler');
          new Function(html.slice(start+open.length,end));
          console.log('PASS: accessible green-and-gold discovery grids, compact images, and preserved card actions.');
          JS

      - name: Keep Creator Studio Music Library browse-only
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/gideondreams3325/traydaq/${GITHUB_SHA}/scripts/patch-private-creator-music.mjs" \
            --output /tmp/traydaq-creator-music-patch.mjs
          node --check /tmp/traydaq-creator-music-patch.mjs
          node /tmp/traydaq-creator-music-patch.mjs .
          grep -Fq 'id="tdCreatorMusicBrowseOnly"' index.html
          grep -Fq 'No songs available for reuse yet. Check back later.' index.html
          grep -Fq "creatorPickerIntro = 'Use music released by artists who permit creator reuse'" index.html
          echo 'PASS: Creator Studio displays the song picker without its upload button.'

      - name: Show original video cover and enable precise timeline scrubbing
        shell: bash
        run: |
          set -euo pipefail
          # Run public patch only against temporary private checkout; never export the app source.
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/gideondreams3325/traydaq/${GITHUB_SHA}/scripts/patch-private-video-cover-timeline.mjs" \
            --output /tmp/traydaq-video-cover-timeline-patch.mjs
          node --check /tmp/traydaq-video-cover-timeline-patch.mjs
          node /tmp/traydaq-video-cover-timeline-patch.mjs .
          node --check creator-studio.js
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const s=fs.readFileSync('creator-studio.js','utf8');
          for(const marker of ['tdLiveVideoCoverTimeline2026',
            'id="studioCoverScrubPreview"', 'step=".05"',
            'generateStudioVideoCover(opening, true)', 'previewImage.hidden = true',
