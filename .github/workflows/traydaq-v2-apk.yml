name: TRAYDAQ V2 APK (Public Builder)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/traydaq-v2-apk.yml'

permissions:
  contents: read

concurrency:
  group: traydaq-v2-public-native-apk
  cancel-in-progress: false

jobs:
  build-v2:
    name: Build current React Native TRAYDAQ V2 APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Confirm private V2 source access
        env:
          V2_SOURCE_TOKEN: ${{ secrets.TRAYDAQ_V2_SOURCE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$V2_SOURCE_TOKEN" ]; then
            echo "::error::Missing TRAYDAQ_V2_SOURCE_TOKEN. Add a Contents: Read fine-grained token scoped to traydaq-v2."
            exit 1
          fi
          if ! curl -fsSL --retry 0 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $V2_SOURCE_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/gideondreams3325/traydaq-v2" -o /dev/null; then
            echo "::error::TRAYDAQ_V2_SOURCE_TOKEN does not have read access to private V2."
            exit 1
          fi

      - name: Checkout latest private V2 source
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: main
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify React Native source and official logo
        shell: bash
        run: |
          set -euo pipefail
          test -f mobile/app.json
          test -f mobile/package.json
          test -f mobile/src/App.tsx
          test -f mobile/src/new-design/SecurityHubScreen.tsx
          test -f mobile/src/new-design/HomeFeedScreen.tsx
          test -f mobile/src/new-design/MusicV2Screen.tsx
          test -f mobile/src/new-design/AccountAccessScreen.tsx
          test -f mobile/assets/traydaq-logo.png
          test -f mobile/google-services.json
          grep -Fq '"package": "com.traydaq.app"' mobile/app.json
          grep -Fq '"icon": "./assets/traydaq-logo.png"' mobile/app.json
          node -e "const p=require('./mobile/package.json');if(!p.dependencies?.expo||!p.dependencies?.['react-native'])process.exit(1)"
          echo "Native V2 and padded TRAYDAQ logo verified."
          echo "Source commit: $(git rev-parse HEAD)"

      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK from preinstalled runner tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT" && test -d "$SDK_ROOT/cmdline-tools"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

      - name: Install native dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Test all React Native V2 contracts
        working-directory: mobile
        run: node --test tests/*.test.mjs

      - name: Typecheck current V2 Android app
        working-directory: mobile
        run: npm run typecheck

      - name: Validate Expo dependency compatibility
        working-directory: mobile
        run: npx expo-doctor

      - name: Generate Android native project
        working-directory: mobile
        run: npm run prebuild:android

      - name: Build Android native debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Stage installable debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apk
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk apk/TRAYDAQ-V2-native-debug.apk
          test -s apk/TRAYDAQ-V2-native-debug.apk
          sha256sum apk/TRAYDAQ-V2-native-debug.apk

      - name: Upload APK only, never private source
        uses: actions/upload-artifact@v4
        with:
          name: TRAYDAQ-V2-native-debug-APK
          path: apk/TRAYDAQ-V2-native-debug.apk
          retention-days: 14
          if-no-files-found: error
