name: TRAYDAQ V2 APK (Public Builder)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/traydaq-v2-apk.yml'

permissions:
  contents: read

concurrency:
  group: traydaq-v2-public-apk
  cancel-in-progress: false

jobs:
  build-v2:
    name: Build independent TRAYDAQ V2 debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Confirm private V2 source access
        env:
          V2_SOURCE_TOKEN: ${{ secrets.TRAYDAQ_V2_SOURCE_TOKEN }}
        shell: bash
        run: |
          if [ -z "$V2_SOURCE_TOKEN" ]; then
            echo "::error::Missing read-only V2 source access. Add TRAYDAQ_V2_SOURCE_TOKEN to public repository Actions secrets with Contents: Read for ONLY gideondreams3325/traydaq-v2."
            exit 1
          fi
          # GitHub Actions on this public repository cannot read a different
          # private repository with GITHUB_TOKEN or the legacy SellerFlow token.
          # Check V2-specific read access first and avoid checkout retry loops.
          if ! curl -fsSL --retry 0 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $V2_SOURCE_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/gideondreams3325/traydaq-v2" \
            -o /dev/null; then
            echo "::error::TRAYDAQ_V2_SOURCE_TOKEN cannot access private gideondreams3325/traydaq-v2. Replace the public builder's Actions secret with a fine-grained GitHub PAT scoped ONLY to traydaq-v2 and Contents: Read. Do not reuse the legacy SellerFlow token."
            exit 1
          fi
          echo "Private V2 source access confirmed."

      - name: Checkout private TRAYDAQ V2 source without publishing it
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: main
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1

      - name: Check that only new V2 source was checked out
        shell: bash
        run: |
          set -euo pipefail
          test -f capacitor.config.ts
          test -f src/feed/AlbumComposer.tsx
          test -f src/profile/ProfilePage.tsx
          test -f src/profile/profile.css
          test -f supabase/functions/submit-album-picture/index.ts
          grep -Fq 'appId: "com.traydaq.app"' capacitor.config.ts
          grep -Fq '"name": "traydaq-v2"' package.json
          echo "TRAYDAQ V2 source and distinct Android application ID verified."

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install V2 project dependencies
        run: npm install --no-audit --no-fund

      - name: Test and build TRAYDAQ V2 web app
        run: npm run check

      - name: Install Android API 35 using runner SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "Using preinstalled Android SDK at ${ANDROID_HOME:-${ANDROID_SDK_ROOT:-unknown}}"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK root not set}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          test -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platforms/android-35"
          test -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/35.0.0"

      - name: Generate V2 Android wrapper (no legacy code)
        run: |
          npx cap add android
          npx cap sync android

      - name: Build V2 debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Stage Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/TRAYDAQ-V2-debug.apk
          test -s apk/TRAYDAQ-V2-debug.apk

      - name: Upload V2 APK only (never upload private source)
        uses: actions/upload-artifact@v4
        with:
          name: TRAYDAQ-V2-debug-APK
          path: apk/TRAYDAQ-V2-debug.apk
          if-no-files-found: error
          retention-days: 14
