name: TRAYDAQ V2 APK (Public Builder)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/traydaq-v2-apk.yml'

permissions:
  contents: read

concurrency:
  group: traydaq-v2-public-apk
  cancel-in-progress: false

jobs:
  build-v2:
    name: Build independent TRAYDAQ V2 debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Confirm private V2 source access
        env:
          V2_SOURCE_TOKEN: ${{ secrets.TRAYDAQ_V2_SOURCE_TOKEN || secrets.SELLERFLOW_SOURCE_TOKEN }}
        shell: bash
        run: |
          if [ -z "$V2_SOURCE_TOKEN" ]; then
            echo "::error::Missing read-only V2 source access. Add TRAYDAQ_V2_SOURCE_TOKEN to public repository Actions secrets with Contents: Read for ONLY gideondreams3325/traydaq-v2."
            exit 1
          fi
          echo "Source token present; permissions will be verified by checkout."

      - name: Checkout private TRAYDAQ V2 source without publishing it
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: main
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_TOKEN || secrets.SELLERFLOW_SOURCE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1

      - name: Check that only new V2 source was checked out
        shell: bash
        run: |
          set -euo pipefail
          test -f capacitor.config.ts
          test -f src/feed/AlbumComposer.tsx
          test -f supabase/functions/submit-album-picture/index.ts
          grep -Fq 'appId: "com.traydaq.app"' capacitor.config.ts
          grep -Fq '"name": "traydaq-v2"' package.json
          echo "TRAYDAQ V2 source and distinct Android application ID verified."

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install V2 project dependencies
        run: npm install --no-audit --no-fund

      - name: Test and build TRAYDAQ V2 web app
        run: npm run check

      - name: Generate V2 Android wrapper (no legacy code)
        run: |
          npx cap add android
          npx cap sync android

      - name: Build V2 debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Stage Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/TRAYDAQ-V2-debug.apk
          test -s apk/TRAYDAQ-V2-debug.apk

      - name: Upload V2 APK only (never upload private source)
        uses: actions/upload-artifact@v4
        with:
          name: TRAYDAQ-V2-debug-APK
          path: apk/TRAYDAQ-V2-debug.apk
          if-no-files-found: error
          retention-days: 14
