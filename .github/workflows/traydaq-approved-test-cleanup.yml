name: Traydaq Approved Test Accounts (Private UID Selection)

# Owner-only manual workflow. Never print/upload selected UIDs on public GitHub.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "Preview first; Delete only after preview succeeds"
        required: true
        type: choice
        default: preview
        options:
          - preview
          - delete
      confirmation:
        description: "To delete, type DELETE 903 (leave empty for preview)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: traydaq-firebase-user-cleanup
  cancel-in-progress: false

jobs:
  approved-test-cleanup:
    name: Review or remove explicitly approved plain/pers fixtures
    if: >-
      github.repository == 'gideondreams3325/traydaq' &&
      github.actor == 'gideondreams3325' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Require confirmation for destructive mode
        shell: bash
        env:
          REQUESTED_ACTION: ${{ inputs.action }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [ "$REQUESTED_ACTION" = "delete" ]; then
            if [ "$CONFIRMATION" != 'DELETE 903' ]; then
              echo "::error::Deletion requires exactly DELETE 903. Nothing changed."
              exit 1
            fi
            echo "Authorized deletion requested, subject to a fresh full preflight."
          elif [ "$REQUESTED_ACTION" = "preview" ]; then
            echo "Read-only preview selected."
          else
            exit 1
          fi

      - name: Checkout public repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Firebase Admin SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/traydaq-credential-deps"
          npm install --prefix "$RUNNER_TEMP/traydaq-credential-deps" --ignore-scripts --no-package-lock --no-audit --no-fund firebase-admin@13.5.0
          echo "NODE_PATH=$RUNNER_TEMP/traydaq-credential-deps/node_modules" >> "$GITHUB_ENV"
          node --check scripts/traydaq-user-approved-select.cjs
          node --check scripts/firebase-auth-test-cleanup.cjs

      - name: Load existing private Firebase credential
        shell: bash
        env:
          FIREBASE_ADMIN_JSON: ${{ secrets.TRAYDAQ_FIREBASE_ADMIN_JSON }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "$FIREBASE_ADMIN_JSON" ]; then
            echo "::error::Missing TRAYDAQ_FIREBASE_ADMIN_JSON. Nothing changed."
            exit 1
          fi
          printf '%s' "$FIREBASE_ADMIN_JSON" > "$RUNNER_TEMP/traydaq-admin.json"
          chmod 600 "$RUNNER_TEMP/traydaq-admin.json"
          node - "$RUNNER_TEMP/traydaq-admin.json" <<'NODE'
          const fs = require('node:fs');
          const account = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (account.type !== 'service_account' || account.project_id !== 'sellerflow-efaab') {
            console.error('::error::Firebase project mismatch. Nothing changed.');
            process.exit(1);
          }
          console.log('Target project verified.');
          NODE
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/traydaq-admin.json" >> "$GITHUB_ENV"

      - name: Select exact prefixes and check RTDB plus Firestore activity
        shell: bash
        env:
          GOOGLE_CLOUD_PROJECT: sellerflow-efaab
        run: |
          set -euo pipefail
          node scripts/traydaq-user-approved-select.cjs "$RUNNER_TEMP/traydaq-confirmed-eligible-uids.txt"
          test -s "$RUNNER_TEMP/traydaq-confirmed-eligible-uids.txt"

      - name: Preflight every selected Firebase Auth account
        shell: bash
        env:
          GOOGLE_CLOUD_PROJECT: sellerflow-efaab
        run: |
          set -euo pipefail
          node scripts/firebase-auth-test-cleanup.cjs delete \
            --uids-file="$RUNNER_TEMP/traydaq-confirmed-eligible-uids.txt" \
            --confirm-project=sellerflow-efaab --redact

      - name: Delete approved eligible Authentication accounts only
        if: inputs.action == 'delete'
        shell: bash
        env:
          GOOGLE_CLOUD_PROJECT: sellerflow-efaab
        run: |
          set -euo pipefail
          node scripts/firebase-auth-test-cleanup.cjs delete \
            --uids-file="$RUNNER_TEMP/traydaq-confirmed-eligible-uids.txt" \
            --confirm-project=sellerflow-efaab --redact --execute

      - name: Remove private credential and UID files
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/traydaq-admin.json" "$RUNNER_TEMP/traydaq-confirmed-eligible-uids.txt"
